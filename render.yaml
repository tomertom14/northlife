services:
  - type: web
    name: northlife
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    preDeployCommand: dotnet NorthLife.Api.dll --migrate
    disk:
      name: event-images
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Authentication__JwtKey
        generateValue: true
      # Render Postgres exposes connectionString (not host/port); the API converts the URL for Npgsql.
      - key: Database__Url
        fromDatabase:
          name: northlife-db
          property: connectionString
      - key: GoogleMaps__ApiKey
        sync: false
      - key: GoogleMaps__MapId
        sync: false

databases:
  - name: northlife-db
    region: frankfurt
    plan: 0.1c-256mb
    ipAllowList: []
