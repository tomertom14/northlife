name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=northlife;Username=northlife;Password=northlife_ci_only
      Authentication__JwtKey: northlife-ci-only-signing-key-32-bytes
      ImageStorage__RootPath: /tmp/northlife-images
      BootstrapAdmin__Email: ci-admin@northlife.local
      BootstrapAdmin__Password: NorthLifeCi12345
      BootstrapAdmin__FullName: CI Admin
      BootstrapAdmin__Phone: "0500000001"
      BootstrapAdmin__BusinessName: NorthLife CI
      DataProtection__KeysPath: /tmp/northlife-keys
      Email__Provider: Smtp
      Email__Smtp__Host: localhost
      Email__Smtp__Port: "1025"
      Email__PublicBaseUrl: http://127.0.0.1:5080
      RateLimiting__AuthPermitsPerMinute: "200"
      RateLimiting__EmailPermitsPer15Minutes: "50"
      Analytics__RollupIntervalSeconds: "5"
      Analytics__IngestLagSeconds: "5"
      Metrics__AllowPrivateNetwork: "true"
      Demo__OwnerPassword: DemoOwnerCi-2026
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: northlife
          POSTGRES_USER: northlife
          POSTGRES_PASSWORD: northlife_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northlife -d northlife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore NorthLife.slnx
      - run: dotnet build NorthLife.slnx --configuration Release --no-restore
      - run: dotnet test NorthLife.slnx --configuration Release --no-build
      - run: dotnet tool restore
      - run: dotnet tool run dotnet-ef database update --project backend/NorthLife.Api --startup-project backend/NorthLife.Api
      - run: dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --seed-data
      - run: dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --seed-data
      - run: dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --bootstrap-admin
      - run: dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --seed-demo
      - name: Verify public API, authentication, and images
        shell: bash
        run: |
          dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --urls http://127.0.0.1:5080 > api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            sleep 1
          done

          # RFC 6238 TOTP for the given Base32 secret, computed independently of the API.
          totp() {
            python3 - "$1" <<'PY'
          import base64, hashlib, hmac, struct, sys, time
          secret = sys.argv[1].replace(' ', '').upper()
          key = base64.b32decode(secret + '=' * (-len(secret) % 8))
          digest = hmac.new(key, struct.pack('>Q', int(time.time()) // 30), hashlib.sha1).digest()
          offset = digest[-1] & 15
          print('%06d' % ((struct.unpack('>I', digest[offset:offset + 4])[0] & 0x7fffffff) % 1000000))
          PY
          }
          # Newest email to an address in Mailpit, reduced to the token of its link.
          mail_token() {
            local id
            for attempt in {1..10}; do
              id=$(curl --fail --silent "http://127.0.0.1:8025/api/v1/search?query=to:$1" | jq -r '.messages[0].ID // empty')
              [ -n "$id" ] && break
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:8025/api/v1/message/$id" | jq -r '.Text' | grep -o 'token=[A-Za-z0-9_-]*' | head -1 | cut -d= -f2
          }

          curl --fail --silent http://127.0.0.1:5080/api/events/today | jq -e '.totalCount >= 1 and (.items | length) >= 1'
          curl --fail --silent http://127.0.0.1:5080/api/events/top-picks | jq -e 'length >= 1'
          curl --fail --silent http://127.0.0.1:5080/api/events/019924c0-0000-7000-a000-000000000001 | jq -e '.title != null'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/events/019924c0-0000-7000-a000-000000000004)" = "404"
          curl --fail --silent 'http://127.0.0.1:5080/api/events/map?north=33.5&south=32.5&east=36.1&west=34.7&period=today' | jq -e '.truncated == false and (.items | length) >= 1 and (.items[0].latitude != null)'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" 'http://127.0.0.1:5080/api/events/map?north=32&south=33&east=36&west=35')" = "400"
          curl --fail --silent http://127.0.0.1:5080/api/config/public | jq -e 'has("googleMapsApiKey") and has("googleMapsMapId")'

          registration=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/register --header 'Content-Type: application/json' --data '{"fullName":"CI Owner","email":"ci-owner@example.com","password":"StrongPass123","phone":"0501234567","businessName":"CI Business","role":"Admin"}')
          echo "$registration" | jq -e '.user.role == "BusinessOwner" and (.token | length > 20)'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/register --header 'Content-Type: application/json' --data '{"fullName":"CI Owner","email":"ci-owner@example.com","password":"StrongPass123","phone":"0501234567","businessName":"CI Business"}')" = "409"

          login=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"ci-owner@example.com","password":"StrongPass123"}')
          token=$(echo "$login" | jq -r '.token')
          echo "$login" | jq -e '.user.role == "BusinessOwner"'
          curl --fail --silent http://127.0.0.1:5080/api/auth/session --header "Authorization: Bearer $token" | jq -e '.role == "BusinessOwner" and .emailConfirmed == false'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/auth/session --header 'Authorization: Bearer invalid')" = "401"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/logout --header "Authorization: Bearer $token")" = "204"

          # The owner proves the email address through the link Mailpit caught; each link works once.
          verify_token=$(mail_token ci-owner@example.com)
          test -n "$verify_token"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/verify-email --header 'Content-Type: application/json' --data "{\"token\":\"$verify_token\"}")" = "204"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/verify-email --header 'Content-Type: application/json' --data "{\"token\":\"$verify_token\"}")" = "400"
          curl --fail --silent http://127.0.0.1:5080/api/auth/session --header "Authorization: Bearer $token" | jq -e '.emailConfirmed == true'

          admin_login=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"ci-admin@northlife.local","password":"NorthLifeCi12345"}')
          admin_password_token=$(echo "$admin_login" | jq -r '.token')
          echo "$admin_login" | jq -e '.user.role == "Admin" and .user.mfaVerified == false'
          # Administrators cannot moderate until TOTP is enrolled.
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/admin/events --header "Authorization: Bearer $admin_password_token")" = "403"
          totp_secret=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/security/totp/setup --header "Authorization: Bearer $admin_password_token" | jq -r '.secret')
          enabled=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/security/totp/enable --header "Authorization: Bearer $admin_password_token" --header 'Content-Type: application/json' --data "{\"code\":\"$(totp "$totp_secret")\"}")
          echo "$enabled" | jq -e '(.recoveryCodes | length) == 10 and .auth.user.mfaVerified == true'
          admin_token=$(echo "$enabled" | jq -r '.auth.token')
          # The next sign-in stops at the second factor; a backup code works exactly once.
          challenge=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"ci-admin@northlife.local","password":"NorthLifeCi12345"}')
          echo "$challenge" | jq -e '.status == "mfa_required" and (has("token") | not)'
          mfa_ticket=$(echo "$challenge" | jq -r '.mfaToken')
          backup_code=$(echo "$enabled" | jq -r '.recoveryCodes[0]')
          curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/mfa --header 'Content-Type: application/json' --data "{\"mfaToken\":\"$mfa_ticket\",\"code\":\"$backup_code\"}" | jq -e '.user.mfaVerified == true'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/mfa --header 'Content-Type: application/json' --data "{\"mfaToken\":\"$mfa_ticket\",\"code\":\"$backup_code\"}")" = "401"
          second_owner=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/register --header 'Content-Type: application/json' --data '{"fullName":"CI Image Owner","email":"ci-image-owner@example.com","password":"StrongPass123","phone":"0501234568","businessName":"CI Images"}')
          second_token=$(echo "$second_owner" | jq -r '.token')
          # Verified like the first owner, so the ownership checks below reach the ownership rule
          # (an unverified owner is refused earlier with 403 email_not_verified).
          second_verify=$(mail_token ci-image-owner@example.com)
          test -n "$second_verify"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/verify-email --header 'Content-Type: application/json' --data "{\"token\":\"$second_verify\"}")" = "204"
          image=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/manage/images --header "Authorization: Bearer $token" --form 'file=@docs/screenshots/phase-5-dashboard.png;type=image/png')
          image_id=$(echo "$image" | jq -r '.id')
          echo "$image" | jq -e '.contentType == "image/webp" and .width <= 1600 and .height <= 1600 and .sizeBytes > 0'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/images/$image_id)" = "404"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/images/$image_id --header "Authorization: Bearer $token")" = "200"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/images/$image_id --header "Authorization: Bearer $second_token")" = "404"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/manage/images --header "Authorization: Bearer $token" --form 'file=@docs/screenshots/phase-5-dashboard.png;type=image/jpeg')" = "400"

          event_start=$(date -u -d '+2 days' +%Y-%m-%dT%H:%M:%SZ)
          event_end=$(date -u -d '+2 days 2 hours' +%Y-%m-%dT%H:%M:%SZ)
          event_payload=$(jq -n --arg image_id "$image_id" --arg start "$event_start" --arg end "$event_end" '{title:"CI owner event",description:"Created by the owner-management smoke test",category:"Culture",venueName:"CI venue",locality:"Kiryat Shmona",address:"CI address",latitude:33.2,longitude:35.5,startAt:$start,endAt:$end,price:25,imageId:$image_id,organizerName:"CI Business",tags:["ci"]}')
          owner_event=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/manage/events --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data "$event_payload")
          event_id=$(echo "$owner_event" | jq -r '.id')
          echo "$owner_event" | jq -e '.status == "Pending" and .revision == 1'
          curl --fail --silent http://127.0.0.1:5080/api/manage/events --header "Authorization: Bearer $token" | jq -e --arg id "$event_id" 'any(.[]; .id == $id)'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/manage/events/$event_id --header "Authorization: Bearer $second_token")" = "404"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/manage/events --header "Authorization: Bearer $second_token" --header 'Content-Type: application/json' --data "$event_payload")" = "404"
          stale_payload=$(echo "$event_payload" | jq '.revision = 99')
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request PUT http://127.0.0.1:5080/api/manage/events/$event_id --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data "$stale_payload")" = "409"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/admin/events --header "Authorization: Bearer $token")" = "403"
          curl --fail --silent 'http://127.0.0.1:5080/api/admin/events?status=Pending&search=CI' --header "Authorization: Bearer $admin_token" | jq -e --arg id "$event_id" 'any(.[]; .id == $id)'
          approved=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/admin/events/$event_id/approve --header "Authorization: Bearer $admin_token" --header 'Content-Type: application/json' --data '{"revision":1}')
          echo "$approved" | jq -e '.status == "Published" and .revision == 2'
          curl --fail --silent http://127.0.0.1:5080/api/events/$event_id | jq -e '.title == "CI owner event"'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/admin/events/$event_id/reject --header "Authorization: Bearer $admin_token" --header 'Content-Type: application/json' --data '{"revision":1,"reason":"stale"}')" = "409"
          highlighted=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/admin/events/$event_id/highlight --header "Authorization: Bearer $admin_token" --header 'Content-Type: application/json' --data '{"revision":2,"isHighlighted":true}')
          echo "$highlighted" | jq -e '.isHighlighted == true and .revision == 3'

          # User management: suspension ends live sessions at once and hides the owner's events until lifted.
          owner_id=$(curl --fail --silent http://127.0.0.1:5080/api/auth/session --header "Authorization: Bearer $token" | jq -r '.id')
          curl --fail --silent 'http://127.0.0.1:5080/api/admin/users?search=ci-owner' --header "Authorization: Bearer $admin_token" | jq -e --arg id "$owner_id" '(.items | length) == 1 and .items[0].id == $id and .items[0].publishedEvents == 1'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/admin/users --header "Authorization: Bearer $token")" = "403"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/admin/users/$owner_id/suspend --header "Authorization: Bearer $admin_token" --header 'Content-Type: application/json' --data '{"reason":"CI suspension"}')" = "204"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/auth/session --header "Authorization: Bearer $token")" = "401"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"ci-owner@example.com","password":"StrongPass123"}')" = "403"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/events/$event_id)" = "404"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/admin/users/$owner_id/unsuspend --header "Authorization: Bearer $admin_token")" = "204"
          curl --fail --silent http://127.0.0.1:5080/api/events/$event_id | jq -e '.title == "CI owner event"'
          curl --fail --silent 'http://127.0.0.1:5080/api/admin/audit?pageSize=10' --header "Authorization: Bearer $admin_token" | jq -e --arg id "$owner_id" '[.items[] | select(.targetId == $id) | .action] | (index("user.suspended") != null) and (index("user.unsuspended") != null)'
          token=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"ci-owner@example.com","password":"StrongPass123"}' | jq -r '.token')

          # Analytics: batched interactions, the 30-minute deduplication window, the rollup worker and the owner report.
          visitor=$(cat /proc/sys/kernel/random/uuid)
          track=$(jq -n --arg v "$visitor" --arg e "$event_id" '{visitorId:$v, interactions:[{eventId:$e,type:"Impression",source:"Feed",position:1},{eventId:$e,type:"DetailView",source:"Feed",position:1},{eventId:$e,type:"Navigate",source:"Details"}]}')
          curl --fail --silent --request POST http://127.0.0.1:5080/api/analytics/events --header 'Content-Type: application/json' --data "$track" | jq -e '.recorded == 3'
          curl --fail --silent --request POST http://127.0.0.1:5080/api/analytics/events --header 'Content-Type: application/json' --data "$track" | jq -e '.recorded == 0'
          for attempt in $(seq 1 40); do
            views=$(curl --fail --silent 'http://127.0.0.1:5080/api/manage/analytics?days=7' --header "Authorization: Bearer $token" | jq '.totals.detailViews')
            [ "$views" -ge 1 ] && break
            sleep 1
          done
          curl --fail --silent 'http://127.0.0.1:5080/api/manage/analytics?days=7' --header "Authorization: Bearer $token" | jq -e --arg id "$event_id" '.totals.navigations >= 1 and .totals.uniqueVisitors >= 1 and (.events | any(.id == $id and .detailViews >= 1))'
          # Read the whole response first: under pipefail, grep -q stopping at its first match makes curl fail
          # with a write error (exit 23).
          metrics=$(curl --fail --silent http://127.0.0.1:5080/metrics)
          grep -q '^northlife_analytics_interactions_recorded_total' <<< "$metrics"
          # The demo seed rolled a simulated month up for its owners.
          demo_token=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"owner1@demo.northlife.local","password":"DemoOwnerCi-2026"}' | jq -r '.token')
          curl --fail --silent 'http://127.0.0.1:5080/api/manage/analytics?days=30' --header "Authorization: Bearer $demo_token" | jq -e '.totals.impressions > 100 and .totals.uniqueVisitors > 10 and (.daily | length) == 30'

          # Ranking: the hot and near-me sorts, geohashes in step with coordinates, the fitted position bias.
          from=$(TZ=Asia/Jerusalem date +%Y-%m-%d)
          to=$(TZ=Asia/Jerusalem date -d '+13 days' +%Y-%m-%d)
          curl --fail --silent "http://127.0.0.1:5080/api/events?period=range&from=$from&to=$to&sort=hot&pageSize=12" | jq -e '(.items | length) == 12'
          curl --fail --silent "http://127.0.0.1:5080/api/events?period=range&from=$from&to=$to&sort=near&latitude=33.2073&longitude=35.57&pageSize=12" | jq -e '[.items[].distanceKm] as $d | ($d | length) == 12 and $d == ($d | sort)'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" 'http://127.0.0.1:5080/api/events?period=today&sort=near')" = "400"
          test "$(PGPASSWORD=northlife_ci_only psql --host localhost --username northlife --dbname northlife --tuples-only --no-align --command "SELECT count(*) FROM events WHERE geohash <> geohash_encode(latitude::float8, longitude::float8, 9)")" = "0"
          curl --fail --silent http://127.0.0.1:5080/api/admin/analytics/position-bias --header "Authorization: Bearer $admin_token" | jq -e 'length == 12 and .[0].propensity == 1'

          # Recommendations: popular picks for a new visitor, personal ones right after an interaction, similar events.
          reco_visitor=$(cat /proc/sys/kernel/random/uuid)
          curl --fail --silent "http://127.0.0.1:5080/api/recommendations?visitorId=$reco_visitor&limit=5" | jq -e '.personalised == false and (.items | length) == 5'
          first_event=$(curl --fail --silent "http://127.0.0.1:5080/api/events?period=range&from=$from&to=$to&pageSize=1" | jq -r '.items[0].id')
          curl --fail --silent --request POST http://127.0.0.1:5080/api/analytics/events --header 'Content-Type: application/json' --data "{\"visitorId\":\"$reco_visitor\",\"interactions\":[{\"eventId\":\"$first_event\",\"type\":\"DetailView\",\"source\":\"Feed\",\"position\":1}]}" | jq -e '.recorded == 1'
          curl --fail --silent "http://127.0.0.1:5080/api/recommendations?visitorId=$reco_visitor&limit=5" | jq -e --arg id "$first_event" '.personalised == true and all(.items[]; .event.id != $id)'
          curl --fail --silent "http://127.0.0.1:5080/api/events/$first_event/similar" | jq -e --arg id "$first_event" 'length >= 1 and all(.[]; .id != $id)'
          # An absolute path: dotnet run starts the app in the project folder, not the repository root.
          dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --evaluate-recommendations "$PWD/evaluation.md" > /dev/null
          grep -q 'Oracle' "$PWD/evaluation.md"

          rejected_payload=$(echo "$event_payload" | jq '.title = "CI rejected event"')
          rejected_event=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/manage/events --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data "$rejected_payload")
          rejected_id=$(echo "$rejected_event" | jq -r '.id')
          rejected=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/admin/events/$rejected_id/reject --header "Authorization: Bearer $admin_token" --header 'Content-Type: application/json' --data '{"revision":1,"reason":"Add accessibility details"}')
          echo "$rejected" | jq -e '.status == "Rejected" and .rejectionReason == "Add accessibility details"'
          curl --fail --silent http://127.0.0.1:5080/api/manage/events --header "Authorization: Bearer $token" | jq -e --arg id "$rejected_id" 'any(.[]; .id == $id and .rejectionReason == "Add accessibility details")'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/events/$rejected_id)" = "404"

          direct_payload=$(echo "$event_payload" | jq '.title = "CI admin event"')
          direct=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/admin/events --header "Authorization: Bearer $admin_token" --header 'Content-Type: application/json' --data "$direct_payload")
          direct_id=$(echo "$direct" | jq -r '.id')
          echo "$direct" | jq -e '.status == "Published" and .revision == 1'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request DELETE "http://127.0.0.1:5080/api/admin/events/$direct_id?revision=1" --header "Authorization: Bearer $admin_token")" = "204"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request DELETE "http://127.0.0.1:5080/api/admin/events/$event_id?revision=3" --header "Authorization: Bearer $admin_token")" = "204"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test -- --watch=false

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag northlife:ci .
      - name: Verify production artifact and non-root user
        run: |
          docker run --rm --entrypoint sh northlife:ci -c 'test -f /app/wwwroot/index.html && test "$(id -u)" != "0"'
