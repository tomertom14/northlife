name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=northlife;Username=northlife;Password=northlife_ci_only
      Authentication__JwtKey: northlife-ci-only-signing-key-32-bytes
      ImageStorage__RootPath: /tmp/northlife-images
      BootstrapAdmin__Email: ci-admin@northlife.local
      BootstrapAdmin__Password: NorthLifeCi12345
      BootstrapAdmin__FullName: CI Admin
      BootstrapAdmin__Phone: "0500000001"
      BootstrapAdmin__BusinessName: NorthLife CI
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: northlife
          POSTGRES_USER: northlife
          POSTGRES_PASSWORD: northlife_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northlife -d northlife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore NorthLife.slnx
      - run: dotnet build NorthLife.slnx --configuration Release --no-restore
      - run: dotnet test NorthLife.slnx --configuration Release --no-build
      - run: dotnet tool restore
      - run: dotnet tool run dotnet-ef database update --project backend/NorthLife.Api --startup-project backend/NorthLife.Api
      - run: dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --seed-data
      - run: dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --seed-data
      - run: dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --bootstrap-admin
      - name: Verify public API, authentication, and images
        shell: bash
        run: |
          dotnet run --project backend/NorthLife.Api --configuration Release --no-build --no-launch-profile -- --urls http://127.0.0.1:5080 > api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:5080/api/events/today | jq -e '.totalCount >= 1 and (.items | length) >= 1'
          curl --fail --silent http://127.0.0.1:5080/api/events/top-picks | jq -e 'length >= 1'
          curl --fail --silent http://127.0.0.1:5080/api/events/019924c0-0000-7000-a000-000000000001 | jq -e '.title != null'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/events/019924c0-0000-7000-a000-000000000004)" = "404"

          registration=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/register --header 'Content-Type: application/json' --data '{"fullName":"CI Owner","email":"ci-owner@example.com","password":"StrongPass123","phone":"0501234567","businessName":"CI Business","role":"Admin"}')
          echo "$registration" | jq -e '.user.role == "BusinessOwner" and (.token | length > 20)'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/register --header 'Content-Type: application/json' --data '{"fullName":"CI Owner","email":"ci-owner@example.com","password":"StrongPass123","phone":"0501234567","businessName":"CI Business"}')" = "409"

          login=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"ci-owner@example.com","password":"StrongPass123"}')
          token=$(echo "$login" | jq -r '.token')
          echo "$login" | jq -e '.user.role == "BusinessOwner"'
          curl --fail --silent http://127.0.0.1:5080/api/auth/session --header "Authorization: Bearer $token" | jq -e '.role == "BusinessOwner"'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/auth/session --header 'Authorization: Bearer invalid')" = "401"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/auth/logout --header "Authorization: Bearer $token")" = "204"

          admin_login=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/login --header 'Content-Type: application/json' --data '{"email":"ci-admin@northlife.local","password":"NorthLifeCi12345"}')
          echo "$admin_login" | jq -e '.user.role == "Admin"'
          second_owner=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/auth/register --header 'Content-Type: application/json' --data '{"fullName":"CI Image Owner","email":"ci-image-owner@example.com","password":"StrongPass123","phone":"0501234568","businessName":"CI Images"}')
          second_token=$(echo "$second_owner" | jq -r '.token')
          image=$(curl --fail --silent --request POST http://127.0.0.1:5080/api/manage/images --header "Authorization: Bearer $token" --form 'file=@docs/screenshots/phase-5-dashboard.png;type=image/png')
          image_id=$(echo "$image" | jq -r '.id')
          echo "$image" | jq -e '.contentType == "image/webp" and .width <= 1600 and .height <= 1600 and .sizeBytes > 0'
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/images/$image_id)" = "404"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/images/$image_id --header "Authorization: Bearer $token")" = "200"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:5080/api/images/$image_id --header "Authorization: Bearer $second_token")" = "404"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" --request POST http://127.0.0.1:5080/api/manage/images --header "Authorization: Bearer $token" --form 'file=@docs/screenshots/phase-5-dashboard.png;type=image/jpeg')" = "400"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test -- --watch=false
