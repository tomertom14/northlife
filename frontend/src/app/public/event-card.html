<article class="event-card" [class.compact]="compact()">
  <a class="image-link" [routerLink]="['/events', event().id]" [attr.aria-label]="'פתיחת ' + event().title">
    <img [src]="imageFor(event())" alt="" width="640" height="400" />
    @if (event().isHighlighted) {
      <span class="highlight">בחירת המערכת</span>
    }
  </a>
  <div class="card-body">
    <div class="meta">
      <span>{{ categoryLabels[event().category] }}</span>
      <span>{{ formatPrice(event().price) }}</span>
    </div>
    <h3><a [routerLink]="['/events', event().id]">{{ event().title }}</a></h3>
    <p class="date">{{ formatDate(event().startAt) }}</p>
    <p class="place">{{ event().venueName }} · {{ event().locality }}</p>
    <a class="details-link" [routerLink]="['/events', event().id]">
      לפרטים
      <span aria-hidden="true">←</span>
    </a>
  </div>
</article>
