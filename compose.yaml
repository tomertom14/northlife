services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northlife}
      POSTGRES_USER: ${POSTGRES_USER:-northlife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - northlife-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northlife} -d ${POSTGRES_DB:-northlife}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  northlife-postgres:
